<main>
  <div class="mb-4">
    <h1 class="text-2xl font-bold text-foreground">Editar receta</h1>
    <p class="text-muted-foreground mt-1">Actualiza los datos de tu receta publicada.</p>
  </div>

  @if (recipe(); as response) {
    @if (response.success) {
      <app-form-recipe
        [categories]="categories()"
        [initState]="response.data"
        (recipeSubmit)="onSubmit($event)"
      />
    } @else {
      <app-error-client href=".." title="No se pudo recuperar la receta" />
    }
  }
</main>
