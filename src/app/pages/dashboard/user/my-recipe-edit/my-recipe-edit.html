<main>
  <a
    href=".."
    (click)="$event.preventDefault(); onCancel()"
    class="inline-flex items-center gap-1.5 text-sm text-secondary hover:text-secondary/60 mb-4 transition-colors"
  >
    <svg lucideArrowLeft class="w-4" />
    Volver a recetas
  </a>

  <div class="mb-4">
    <h1 class="text-2xl font-bold text-foreground">Editar receta</h1>
    <p class="text-muted-foreground mt-1">Actualiza los datos de tu receta publicada.</p>
  </div>

  @if (recipe(); as response) {
    @if (response.success) {
      <app-form-recipe
        [categories]="categories()"
        [initState]="response.data"
        (recipeSubmit)="onSubmit($event)"
        (cancelSubmit)="onCancel()"
      />
    } @else {
      <app-error-client href=".." title="No se pudo recuperar la receta" />
    }
  }
  <app-confirm-dialog
    dialogId="confirm-leave-recipe-edit"
    title="¿Salir sin guardar?"
    description="Si sales ahora, perderás los cambios de la receta."
    (confirmed)="confirmLeave()"
  >
    <svg dialog-icon lucideArrowLeft class="w-5" />
    <span btn_ok>Salir sin guardar</span>
  </app-confirm-dialog>
</main>
