<div class="w-full max-w-3xl mx-auto">
  <h1 class="text-3xl font-bold mb-6">Crear Nuevo Tip</h1>
  <div class="bg-card rounded-xl p-4 sm:p-6 border border-border card-shadow">
    <app-form-tip
      [categories]="categories()"
      [isLoading]="isLoading()"
      (submitTip)="createTip($event)"
      (cancelSubmit)="onCancel()"
    />
  </div>
  <app-confirm-dialog
    dialogId="confirm-leave-tip-create"
    title="¿Salir sin guardar?"
    description="Si sales ahora, perderás los datos del tip que ingresaste."
    (confirmed)="confirmLeave()"
  >
    <svg dialog-icon lucideArrowLeft class="w-5" />
    <span btn_ok>Salir sin guardar</span>
  </app-confirm-dialog>
</div>
