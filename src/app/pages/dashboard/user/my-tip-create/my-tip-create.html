<div class="p-6 max-w-3xl mx-auto w-full">
  <h1 class="text-3xl font-bold mb-6">Crear Nuevo Tip</h1>
  <div class="bg-card rounded-xl p-6 border border-border card-shadow">
    <app-form-tip
      [categories]="categories()"
      [isLoading]="isLoading()"
      (submitTip)="createTip($event)"
    />
  </div>
</div>
