<main>
  <a
    href=".."
    (click)="$event.preventDefault(); onCancel()"
    class="inline-flex items-center gap-1.5 text-sm text-secondary hover:text-secondary/60 mb-4 transition-colors"
  >
    <svg lucideArrowLeft class="w-4" />
    Volver a recetas
  </a>

  <div class="mb-4">
    <h1 class="text-2xl font-bold text-foreground">Crear receta</h1>
    <p class="text-muted-foreground mt-1">Comparte tu nueva receta.</p>
  </div>

  <app-form-recipe
    [categories]="categories()"
    (recipeSubmit)="onSubmit($event)"
    (cancelSubmit)="onCancel()"
  />

  <app-confirm-dialog
    dialogId="confirm-leave-recipe"
    title="¿Salir sin guardar?"
    description="Si sales ahora, perderás los datos de la receta que ingresaste."
    (confirmed)="confirmLeave()"
  >
    <svg dialog-icon lucideArrowLeft class="w-5" />
    <span btn_ok>Salir sin guardar</span>
  </app-confirm-dialog>
</main>
