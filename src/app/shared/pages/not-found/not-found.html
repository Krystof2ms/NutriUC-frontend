<main class="relative flex min-h-screen items-center overflow-hidden bg-background px-6 py-16">
  <div
    aria-hidden="true"
    class="pointer-events-none absolute -right-24 -top-24 h-80 w-80 rounded-full border border-primary/10"
  ></div>

  <div
    aria-hidden="true"
    class="pointer-events-none absolute -bottom-40 -left-20 h-96 w-96 rounded-full border border-secondary/20"
  ></div>

  <div
    class="relative mx-auto grid w-full max-w-6xl items-center gap-12 md:grid-cols-[1.1fr_0.9fr] md:gap-20"
  >
    <section class="order-2 md:order-1">
      <p
        class="mb-5 inline-flex items-center gap-2 text-sm font-semibold uppercase tracking-[0.12em] text-primary"
      >
        <span class="h-2 w-2 rounded-full bg-secondary"></span>
        Página no encontrada
      </p>

      <h1 class="max-w-xl text-4xl font-bold leading-tight text-foreground sm:text-5xl">
        Esta página no está en el menú.
      </h1>

      <p class="mt-5 max-w-lg text-base leading-7 text-muted-foreground">
        Puede que la dirección haya cambiado o que ya no exista. Volvamos a encontrar algo rico y
        saludable.
      </p>

      <p
        class="mt-4 break-all font-mono text-xs text-muted-foreground/80"
        aria-label="Dirección solicitada"
      >
        {{ requestedPath }}
      </p>

      <div class="mt-8 flex flex-wrap items-center gap-3">
        <a
          routerLink="/"
          class="inline-flex items-center gap-2 rounded-md bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground transition-opacity hover:opacity-90"
        >
          <svg lucideArrowLeft class="h-4 w-4"></svg>
          Volver al inicio
        </a>

        <a
          routerLink="/recetas"
          class="inline-flex items-center gap-2 rounded-md border border-border bg-background px-4 py-2.5 text-sm font-semibold text-foreground transition-colors hover:bg-accent"
        >
          Explorar recetas
          <svg lucideArrowUpRight class="h-4 w-4"></svg>
        </a>
      </div>
    </section>

    <div class="order-1 flex justify-center md:order-2 md:justify-end">
      <div
        class="relative flex aspect-square w-full max-w-sm items-center justify-center rounded-full border border-primary/15 bg-accent/50"
      >
        <div class="absolute inset-5 rounded-full border border-dashed border-primary/20"></div>

        <div class="absolute inset-10 rounded-full border border-primary/10"></div>

        <div
          class="relative flex h-44 w-44 items-center justify-center rounded-full bg-card text-primary shadow-lg shadow-primary/10 sm:h-56 sm:w-56"
        >
          <svg lucideLeaf class="h-20 w-20 stroke-[1.2] sm:h-24 sm:w-24" aria-hidden="true"></svg>

          <span
            class="absolute -bottom-3 rounded-full border border-border bg-background px-4 py-1.5 text-sm font-semibold text-foreground"
          >
            NutriUC
          </span>
        </div>

        <span
          class="absolute right-8 top-10 rounded-full bg-secondary px-4 py-2 text-sm font-bold text-secondary-foreground"
        >
          404
        </span>

        <span
          class="absolute bottom-10 left-4 text-xs font-medium uppercase tracking-[0.12em] text-muted-foreground"
        >
          Ups, nos desviamos
        </span>
      </div>
    </div>
  </div>
</main>
