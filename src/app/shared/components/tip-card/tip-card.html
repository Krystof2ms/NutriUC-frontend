<article class="bg-card text-card-foreground rounded-xl card-shadow border border-border p-5 flex flex-col h-full hover:card-shadow-hover transition-shadow">
  <div class="flex items-center justify-between mb-3">
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-primary/10 text-primary">
      {{ category() }}
    </span>
    <span class="text-xs text-muted-foreground flex items-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      {{ ownerName() }}
    </span>
  </div>

  <h3 class="text-xl font-bold mb-2">{{ title() }}</h3>

  <div class="text-muted-foreground text-sm flex-grow mb-4 whitespace-pre-wrap"
       [class.line-clamp-3]="esLarga() && !expanded()">
    {{ content() }}
  </div>

  <div class="flex items-center justify-between mt-auto pt-4 border-t border-border">
    @if (esLarga()) {
      <button type="button" (click)="expanded.set(!expanded())" class="text-sm text-primary font-medium hover:underline cursor-pointer">
        {{ expanded() ? 'Ver menos' : 'Ver más' }}
      </button>
    } @else {
      <span></span>
    }
    <span class="text-xs text-muted-foreground">
      {{ fechaFormateada() }}
    </span>
  </div>
</article>
