<section class="bg-card p-8 rounded-2xl border-2 shadow-sm flex items-center gap-4 max-w-1/3">
  <app-user-icon
    class="w-20 h-20 text-4xl"
    [userId]="id()"
    [name]="name()"
    [has_image]="hasAvatar()"
  />

  <div>
    <h3 className="text-xl font-bold mb-1">{{ name() }}</h3>
    <span class="flex items-center gap-2 text-sm text-muted-foreground">
      <svg lucideMail class="w-4" /> {{ email() }}
    </span>
    <span class="flex items-center gap-2 text-sm text-muted-foreground">
      <svg lucideCalendar class="w-4" /> Miembro desde {{ createAt() | date: 'dd/MM/yyyy' }}
    </span>
  </div>
</section>
