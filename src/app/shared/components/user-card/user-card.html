<section class="bg-card w-full max-w-3xl p-4 sm:p-8 rounded-2xl border-2 shadow-sm flex flex-col sm:flex-row items-start sm:items-center gap-4">
  <app-user-icon
    class="w-20 h-20 text-4xl"
    [userId]="id()"
    [name]="name()"
    [has_image]="hasAvatar()"
  />

  <div class="min-w-0">
    <h3 class="text-xl font-bold mb-1 break-words">{{ name() }}</h3>
    <span class="flex items-center gap-2 text-sm text-muted-foreground break-all">
      <svg lucideMail class="w-4" /> {{ email() }}
    </span>
    <span class="flex items-center gap-2 text-sm text-muted-foreground">
      <svg lucideCalendar class="w-4" /> Miembro desde {{ createAt() | date: 'dd/MM/yyyy' }}
    </span>
  </div>
</section>
