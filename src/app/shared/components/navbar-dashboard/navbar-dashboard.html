<button type="button" (click)="toggleOpen()"
  class="md:hidden fixed top-4 left-4 z-50 p-2 bg-background rounded-md shadow">
  @if (open()) {
  <svg lucideX class="w-5" />
  } @else {
  <svg lucideMenu class="w-5" />
  }
</button>

<aside
  [class]="`fixed top-0 left-0 z-50 h-full w-64 bg-sidebar-background border-r border-border transform transition-transform duration-200 ${open() ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 md:static`">
  <div class="flex h-full flex-col pt-4">
    <div class="w-11/12 h-25 bg-primary self-center rounded-2xl flex flex-col items-center justify-center gap-2 mb-2">
      <app-user-icon class="w-10 h-10" [name]="user().name" [userId]="user().public_id" [has_image]="user().has_image" />
      <span class="text-secondary-foreground text-center">{{user().name}}</span>
    </div>
    <nav class="flex-1 p-2 space-y-2" data-sveltekit-preload-data="tap" data-sveltekit-preload-code="hover">
      <ol class="list-none flex flex-col gap-1">
        @for (link of links; track $index) {
        <app-dashboard-link [name]="link.name" [href]="link.href" [icon]="link.icon" [subLinks]="link.subLinks" [isRoot]="link.isRoot ?? false" />
        }
      </ol>
    </nav>
    <div class="mt-auto p-4 border-t border-border">
      <app-theme-selector variant="sidebar" />
      <button class="p-4 rounded-xl hover:bg-muted flex justify-center items-center gap-4 text-red-400 effect-clicked" type="button"
        (click)="closeSession()">
        <svg lucideLogOut class="w-4" />
        <span class="text-wrap">Cerrar Sesión</span>
      </button>
    </div>
  </div>
</aside>
