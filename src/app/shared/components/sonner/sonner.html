<ngx-sonner-toaster
  closeButton
  position="top-center"
  [toastOptions]="{
    unstyled: true,
    style: {
      width: '350px',
    },
    classes: {
      toast: 'p-4 flex flex-col gap-2 bg-card rounded-lg border border-border text-card-foreground shadow-card',
      title: 'font-semibold text-card-foreground',
      description: 'text-muted-foreground',
      actionButton: 'bg-primary text-primary-foreground hover:opacity-90 rounded-md px-3 py-1.5 transition-colors',
      cancelButton: 'bg-muted text-foreground hover:bg-accent rounded-md px-3 py-1.5 transition-colors',
      success: 'border-l-4 border-l-sonner-state-success',
      error: 'border-l-4 border-l-sonner-state-error',
      warning: 'border-l-4 border-l-sonner-state-warning',
      info: 'border-l-4 border-l-sonner-state-info',
      loading: 'border-l-4 border-l-sonner-state-loading',
      closeButton: `
    bg-destructive/80!
    text-destructive-foreground!
    border-2!
    border-border!
    hover:bg-destructive/50!
    hover:text-destructive-foreground!
    transition-colors
    rounded-md
    p-1!
  `,
    },
  }"
/>
