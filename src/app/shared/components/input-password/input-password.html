<div class="relative">
  <input [type]="type()" [class]="className()" [required]="required()" [placeholder]="placeholder()" [value]="value()" [id]="id()"
    (input)="value.set($event.target.value)" autocomplete="current-password">

  <button
    class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors"
    type="button" [aria-label]="showPassword() ? 'Ocultar contraseña': 'Mostrar contraseña'" (click)="toggleShow()">
    @if (showPassword()) {
    <svg lucideEyeOff class="w-4" />
    } @else {
    <svg lucideEye class="w-4" />
    }
  </button>
</div>
