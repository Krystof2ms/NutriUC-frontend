<li>
  <div [class]="`flex flex-row justify-between rounded-xl px-4 py-2 text-sm font-medium hover:text-foreground hover:bg-muted transition-colors
      ${active() ? 'bg-accent text-primary font-semibold' : 'text-muted-foreground'}`">
    <a [routerLink]="href()" class="flex items-center gap-4 justify-start flex-1">
      <svg [lucideIcon]="icon()" class="w-6" />
      <span>{{ name() }}</span>
    </a>
    @if (hasChildren()) {
    <button class="hover:bg-primary-foreground rounded-4xl p-0.5" (click)="toggleOpen()">
      @if (open()) {
      <svg lucidePanelTopOpen class="w-4" />
      } @else {
      <svg lucidePanelTopClose class="w-4" />
      }
    </button>
    }
  </div>
  @if (open() && subLinks()?.length) {
  <ol class="flex flex-col gap-1 mx-5 mt-1 border-l-2 pl-1 animate-slide-in-300" animate.leave="animate-slide-out-300">
    @for (link of subLinks(); track $index) {
    <app-dashboard-link [name]="link.name" [href]="link.href" [icon]="link.icon" [subLinks]="link.subLinks" />
    }
  </ol>
  }
</li>
