<nav class="bg-card/80 backdrop-blur-lg rounded-2xl border p-1">
  <ul class="flex max-w-[70vw] md:max-w-none gap-1 sm:gap-2 overflow-x-auto">
    @for (link of links; track link.href) {
    <li>
      <a
        [routerLink]="link.href"
        routerLinkActive="bg-accent text-foreground"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex whitespace-nowrap px-2 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-muted-foreground hover:bg-accent"
      >
        {{ link.label }}
      </a>
    </li>
    }
  </ul>
</nav>
