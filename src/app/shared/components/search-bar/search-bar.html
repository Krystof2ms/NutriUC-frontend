<div class="flex flex-col sm:flex-row gap-4 mb-8 bg-card p-4 rounded-xl card-shadow border border-border">
  <input 
    type="text" 
    [(ngModel)]="searchQuery" 
    (keyup.enter)="onSearch()" 
    [placeholder]="placeholder()" 
    class="flex-grow p-2 rounded-md border border-border bg-background"
  >
  <select [(ngModel)]="selectedCategory" (change)="onSearch()" class="p-2 rounded-md border border-border bg-background sm:w-48">
    <option value="">Todas las categorías</option>
    @for (cat of categories(); track cat) {
      <option [value]="cat">{{ cat }}</option>
    }
  </select>
  <button (click)="onSearch()" class="bg-primary text-primary-foreground px-6 py-2 rounded-md hover:opacity-90 transition effect-clicked">Buscar</button>
</div>
