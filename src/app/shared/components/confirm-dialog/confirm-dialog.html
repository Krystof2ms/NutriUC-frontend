<dialog
  #dialog
  [id]="dialogId()"
  [attr.aria-labelledby]="dialogId() + '-title'"
  [attr.aria-describedby]="dialogId() + '-description'"
  class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-border bg-card p-0 text-card-foreground shadow-2xl backdrop:bg-foreground/50 backdrop:backdrop-blur-sm"
  (cancel)="$event.preventDefault(); cancel()"
>
  <div class="p-6 sm:p-7">
    <div class="mb-5 flex items-start gap-4">
      <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-destructive/10 text-destructive">
        <ng-content select="[dialog-icon]" />
      </span>
      <div>
        <h2 [id]="dialogId() + '-title'" class="text-xl font-bold">{{ title() }}</h2>
        <p [id]="dialogId() + '-description'" class="mt-2 text-sm leading-relaxed text-muted-foreground">
          {{ description() }}
        </p>
      </div>
    </div>

    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="cancel()"
        [disabled]="busy()"
        class="rounded-lg border border-border px-4 py-2.5 text-sm font-semibold transition-colors hover:bg-accent disabled:cursor-not-allowed disabled:opacity-60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="confirm()"
        [disabled]="busy()"
        [class]="'inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-sm font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-destructive ' + okClass()"
      >
        @if (busy()) {
          {{ busyText() }}
        } @else {
          <ng-content select="[btn_ok]">Confirmar</ng-content>
        }
      </button>
    </div>
  </div>
</dialog>
