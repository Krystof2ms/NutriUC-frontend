<a
  [routerLink]="[href(), id()]"
  class="group bg-card rounded-2xl overflow-hidden transition-all duration-300 hover:-translate-y-1 shadow-sm hover:shadow-md flex flex-col h-full"
>
  <div class="relative h-40 bg-accent overflow-hidden">
    <img
      [src]="image"
      [alt]="alt"
      (error)="onImageError($event)"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
    />
  </div>

  <div class="p-6 flex flex-col flex-1">
    <div class="flex flex-wrap gap-2 mb-3">
      <span class="px-3 py-1 rounded-lg bg-primary/10 text-primary text-xs font-semibold">
        {{ category() }}
      </span>
    </div>

    <h3 class="text-lg font-bold text-foreground mb-2 group-hover:text-primary transition-colors">
      {{ name() }}
    </h3>

    <p class="text-muted-foreground text-sm mb-3">Origen: {{ origin() }}</p>

    <p class="text-xs text-muted-foreground mt-auto">{{ ingredients_count() }} ingredientes</p>
  </div>
</a>
