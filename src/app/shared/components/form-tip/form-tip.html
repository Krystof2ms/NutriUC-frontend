<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
  <div class="space-y-2">
    <label class="text-sm font-medium">Título del Tip</label>
    <input type="text" formControlName="title" class="w-full p-2 rounded-md border border-border bg-background" placeholder="Ej. Cómo conservar la palta fresca...">
  </div>

  <div class="space-y-2">
    <label class="text-sm font-medium">Categoría</label>
    <select formControlName="category" class="w-full p-2 rounded-md border border-border bg-background">
      <option value="" disabled selected>Selecciona una categoría</option>
      @for (cat of categories(); track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </div>

  <div class="space-y-2">
    <label class="text-sm font-medium">Contenido</label>
    <textarea formControlName="content" rows="6" class="w-full p-2 rounded-md border border-border bg-background" placeholder="Escribe tu tip aquí..."></textarea>
  </div>

  <div class="flex justify-end gap-4 pt-4 border-t border-border">
    <button type="button" onclick="history.back()" class="px-4 py-2 rounded-md border border-border hover:bg-muted transition cursor-pointer">Cancelar</button>
    <button type="submit" [disabled]="form.invalid || isLoading()" class="px-4 py-2 rounded-md bg-primary text-primary-foreground hover:opacity-90 transition disabled:opacity-50 cursor-pointer">
      {{ isLoading() ? 'Guardando...' : 'Guardar Tip' }}
    </button>
  </div>
</form>
